# Конфиг сайта для Mini App.
# Кладётся в /etc/nginx/sites-available/budget, DOMAIN заменяется на ваш домен.
#
# Блок с HTTPS дописывает certbot — сначала поднимаем HTTP, получаем сертификат,
# и только потом Telegram сможет открыть приложение (он требует HTTPS).

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /opt/budget/apps/miniapp/dist;
    index index.html;

    # Фото чеков — до 8 МБ, плюс запас на служебные поля формы.
    client_max_body_size 10M;

    # ВАЖНО: не добавляйте X-Frame-Options.
    # Mini App открывается в iframe на web.telegram.org, и запрет фреймов его сломает.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Имена файлов сборки содержат хеш — можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html кэшировать нельзя: иначе после выкладки останется старая версия.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Фото чеков отдаёт nginx напрямую, минуя Node.
    location /uploads/ {
        alias /var/lib/budget/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Выгрузка Excel за год может считаться дольше стандартных 60 секунд.
        proxy_read_timeout 120s;
    }

    # SPA: любой неизвестный путь отдаёт index.html, роутинг разбирает клиент.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
